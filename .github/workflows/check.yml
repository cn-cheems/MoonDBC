name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Update registry
        run: moon update
      - name: Show versions
        run: moon version --all
      - name: Check
        run: |
          moon check --target wasm --deny-warn
          moon check --target wasm-gc --deny-warn
          moon check --target js --deny-warn
      - name: Test
        run: |
          moon test --target wasm --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn
      - name: Test native CLI
        if: runner.os == 'Linux'
        run: |
          moon check --target native --deny-warn
          moon test --target native --deny-warn
          moon run --target native cmd/moondbc -- check examples/vehicle.dbc | grep -q '^OK examples/vehicle.dbc$'
          moon run --target native cmd/moondbc -- list examples/vehicle.dbc | grep -q '^00000123 extended ExtendedStatus'
          moon run --target native cmd/moondbc -- decode examples/vehicle.dbc examples/vehicle.log | grep -q '"Powertrain","Gear",1,1,"","Drive"'
      - name: Verify formatting and interfaces
        shell: bash
        run: |
          moon fmt --check
          moon info
          git diff --exit-code
